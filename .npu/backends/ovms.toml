# Demo fixture: reflects exactly what phase 1 supports (a single wired
# operation, `chat`, via the `openai-compatible` adapter hard-coded in
# backend.rs). The other operations from npu-cli-spec.md §7 (embeddings,
# audio_transcriptions, rerank) will arrive with their support. `[timeouts]`
# (request_secs) is implemented but omitted here: the 120s default suits this
# fixture.

id = "ovms"
type = "openai-compatible"
port = 8000
base_url = "http://127.0.0.1:{{ backend.port }}"

[operations.chat]
method = "POST"
path = "/v3/chat/completions"

# Runtime started by `npu serve qwen3-8b` (Docker, an optional prerequisite).
# `{{ args.model }}` is replaced by the invoked model's `model` field,
# `{{ env.HOME }}` by the environment variable: the core knows nothing about
# OVMS, it just runs what is declared here.
# Targets the Intel NPU on this host — see docs/intel-npu.md for the full
# deployment guide. `--user`/`--group-add` are this machine's uid:gid (1000)
# and render group gid (990, `getent group render`), not templatable: `npu`'s
# [docker] placeholders are only `{{ args.model }}` and `{{ env.NAME }}`, and
# `$UID`/`$GID` aren't exported environment variables by default.
#
# `--model_name`/`--model_path` on purpose, NOT `--source_model`: for a model
# directory already exported locally by `optimum-cli` (git metadata absent),
# `--source_model` fails every time with `Unable to open file: .../graph.pbtxt`
# even when that file is present and readable — verified directly against
# OVMS, independently of `npu`. `--model_name` + `--model_path` is the
# documented way to serve an already-prepared local directory and is what
# `graph.pbtxt`'s own `device` field (baked in by `--configure`, see
# npu-export's step 3.5) actually drives — no `--target_device` flag needed
# here.
[docker]
image = "openvino/model_server:2026.4.0-gpu"
options = [
    "-p", "{{ backend.port }}:8000",
    "-v", "{{ env.HOME }}/models:/models:rw",
    "-v", "{{ env.HOME }}/models/.ov_cache:/cache:rw",
    "--device", "/dev/accel", "--device", "/dev/dri",
    "--group-add", "990", "--user", "1000:1000",
]
args = [
    "--model_name", "{{ args.model }}",
    "--model_path", "/models/{{ args.model }}",
    "--rest_port", "8000",
    "--cache_dir", "/cache",
]

[timeouts]
request_secs = 300
