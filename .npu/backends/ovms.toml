# Demo fixture: reflects exactly what phase 1 supports (a single wired
# operation, `chat`, via the `openai-compatible` adapter hard-coded in
# backend.rs). The other operations from npu-cli-spec.md §7 (embeddings,
# audio_transcriptions, rerank) will arrive with their support. `[timeouts]`
# (request_secs) is implemented but omitted here: the 120s default suits this
# fixture.

id = "ovms"
type = "openai-compatible"
base_url = "http://127.0.0.1:8000"

[operations.chat]
method = "POST"
path = "/v3/chat/completions"

# Runtime started by `npu serve qwen-fast` (Docker, an optional prerequisite).
# `{{ args.model }}` is replaced by the invoked model's `model` field,
# `{{ env.HOME }}` by the environment variable: the core knows nothing about
# OVMS, it just runs what is declared here.
# GPU/NPU variants: image `openvino/model_server:2026.4.0-gpu`, plus
# `--device /dev/dri` (GPU) or `--device /dev/accel` + `--target_device NPU`
# (NPU) — see docs/intel-npu.md for the full deployment guide.
[docker]
image = "openvino/model_server:2026.4.0"
options = [
    "-p", "8000:8000",
    "-v", "{{ env.HOME }}/models:/models:rw",
    "-v", "{{ env.HOME }}/models/.ov_cache:/cache:rw",
]
args = [
    "--source_model", "{{ args.model }}",
    "--model_repository_path", "/models",
    "--rest_port", "8000",
    "--cache_dir", "/cache",
]
