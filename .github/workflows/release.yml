# Triggered by a `vX.Y.Z` tag, which is what the `release` skill pushes.
#
# Three stages, in order: the gate, the binaries, the release. The gate runs
# first on purpose — a tag that does not pass `make qa` must not become a
# downloadable artifact, and finding that out after publishing is too late.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.2.0"
        required: true

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Verify the tag matches Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          package_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "npu") | .version')"
          if [ "$tag" != "v${package_version}" ]; then
            echo "release tag ${tag} does not match Cargo.toml version ${package_version}" >&2
            exit 1
          fi
      - run: make qa

  # Six targets, eight archives. Each ARM target builds where the cross-compile
  # needs no extra toolchain: Linux ARM on a native ARM runner (no cross
  # linker), the Apple pair on one macOS host (a single SDK covers both), the
  # Windows pair on one MSVC host. `ureq`'s TLS is `ring`, which builds for all
  # six without a C toolchain setup step.
  #
  # `label` names the archive; it defaults to the target and only differs for
  # the two distro containers, which build the same triple as the Ubuntu job
  # against their own glibc.
  build:
    needs: qa
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            container: fedora:latest
            label: x86_64-fedora
            setup: dnf -y install gcc curl tar gzip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            container: archlinux:latest
            label: x86_64-arch
            setup: pacman -Syu --noconfirm gcc curl tar gzip
    runs-on: ${{ matrix.os }}
    # Empty for every entry but the two distro ones, which is how the hosted
    # runners keep running directly on the host.
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The distro images ship no Rust: rustup from the official script keeps
      # the toolchain identical to the hosted runners'.
      - name: Distro prerequisites
        if: matrix.setup != ''
        run: |
          set -eux
          ${{ matrix.setup }}
          curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Windows spends 2.3x Linux on the same crate graph, and the tell is the
      # download phase: unpacking the same 149 crates takes 0.9 s on Linux and
      # 10 s here, with no compilation involved. That is Defender scanning
      # every small file rustc and cargo write. Excluding the two directories
      # they write into is the whole fix. Best-effort: an optimization must
      # never be what fails a release.
      - name: Keep Defender out of the build directories
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\target", "$env:USERPROFILE\.cargo"

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      # No build cache here, deliberately. A cache written by a run on
      # `refs/tags/vX.Y.Z` is scoped to that tag and unreachable from the next
      # one, so these eight entries were never read once: ~880 MB written per
      # release, competing for the 10 GB quota with the `qa` cache — the one
      # that does hit, because `qa` on `main` writes the same key.
      - run: cargo build --release --locked --target ${{ matrix.target }}

      # One archive per target, named after the tag and the target so a
      # download says what it is without being opened. `strip = true` is
      # already set in the release profile, nothing to post-process.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.tag || github.ref_name }}"
          platform="${{ matrix.label || matrix.target }}"
          name="npu-${version}-${platform}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/npu" "dist/${name}/"
          cp "target/${{ matrix.target }}/release/npu" "dist/npu-${platform}"
          cp README.md "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.tag || github.ref_name }}"
          platform="${{ matrix.label || matrix.target }}"
          name="npu-${version}-${platform}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/npu.exe" "dist/${name}/"
          cp "target/${{ matrix.target }}/release/npu.exe" "dist/npu-${platform}.exe"
          cp README.md "dist/${name}/"
          7z a "dist/${name}.zip" "./dist/${name}"

      - uses: actions/upload-artifact@v7
        with:
          name: npu-${{ matrix.label || matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/npu-${{ matrix.label || matrix.target }}
            dist/npu-${{ matrix.label || matrix.target }}.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Required to create the release and upload its assets.
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Stable self-update contract. Raw executables avoid making every old
      # client understand archive formats; the manifest maps each runtime
      # platform to its exact asset and authenticates it with SHA-256.
      - name: Generate the update manifest
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          assets='{}'
          count=0

          for path in dist/npu-*; do
            case "$path" in
              *.tar.gz|*.zip) continue ;;
            esac
            name="$(basename "$path")"
            platform="${name#npu-}"
            platform="${platform%.exe}"
            checksum="$(sha256sum "$path" | cut -d ' ' -f 1)"
            assets="$(jq -c \
              --arg platform "$platform" \
              --arg name "$name" \
              --arg sha256 "$checksum" \
              '. + {($platform): {name: $name, sha256: $sha256}}' \
              <<<"$assets")"
            count=$((count + 1))
          done

          if [ "$count" -ne 8 ]; then
            echo "expected 8 update binaries, found $count" >&2
            exit 1
          fi

          jq -n \
            --arg version "$version" \
            --argjson assets "$assets" \
            '{schema_version: 1, version: $version, assets: $assets}' \
            > dist/npu-update.json

      # The notes come from CHANGELOG.md, written by the `release` skill and
      # reviewed in the commit that bumped the version: the published notes are
      # then exactly what the repository says, not a second rewording of it.
      # Missing section (a tag pushed by hand) falls back to GitHub's generated
      # notes rather than publishing an empty release.
      - name: Extract the notes for this tag
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.tag || github.ref_name }}"
          number="${version#v}"
          : > notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v v="$number" '
              $0 ~ "^## \\[" v "\\]" { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > notes.md
          fi
          if grep -q '[^[:space:]]' notes.md; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "CHANGELOG.md has no section for ${number}; falling back to generated notes" >&2
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.tag || github.ref_name }}"
          if [ "${{ steps.notes.outputs.generate }}" = "true" ]; then
            gh release create "$version" dist/* --title "$version" --generate-notes
          else
            gh release create "$version" dist/* --title "$version" --notes-file notes.md
          fi
