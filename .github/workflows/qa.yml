# The gate, unchanged: CI runs `make qa` and nothing else. Reproducing its
# steps here would let CI and a developer's machine drift apart, and the
# repository has exactly one definition of "green".
name: QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push on the same ref makes the previous run pointless.
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    # macOS (arm64) runs the same gate: it is the primary target of the
    # process runtime, and the only place sysinfo's `start_time` is exercised
    # on Darwin. No Metal inference here — the suite needs no accelerator.
    #
    # Windows is a release target, so it runs the gate too. It is allowed to
    # fail until its first runs have been inventoried and fixed; drop
    # `continue-on-error` then.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # No toolchain action: `rust-toolchain.toml` pins 1.98.1 with clippy and
      # rustfmt, and rustup installs it on the first cargo invocation. Naming
      # the version here too would create a second source of truth.
      - name: Show the pinned toolchain
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2

      # `make audit` needs this binary; it is not part of the toolchain.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - run: make qa
