# Complexity thresholds. Clippy defaults = 7 arguments / 250 lines.
too-many-arguments-threshold = 6
too-many-lines-threshold = 120
# Reject placeholder names.
disallowed-names = ["foo", "bar", "baz", "tmp", "toto"]

# Targeted bans (plays the role of deptrac/phpmd "rules", without an external tool).
# Empty for now: fill in once a specific API needs to be forbidden,
# e.g. a concurrent HTTP client or a direct std::env::var outside config.
# disallowed-types = [{ path = "std::collections::HashMap", reason = "..." }]
# disallowed-methods = []
