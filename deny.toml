# cargo-deny: dependency tree audit.
# Covers known vulnerabilities, licenses, and duplicate crates.

[advisories]
# Any known RustSec vulnerability fails the audit.
yanked = "deny"
ignore = []

[licenses]
# Licenses allowed across the whole dependency tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # DATA license (not code), permissive and with no downstream copyleft.
    # Pulled in by webpki-roots, which is just the Mozilla root certificate
    # bundle embedded by ureq. Allowed deliberately, not by default.
    "CDLA-Permissive-2.0",
    # Strictly MORE permissive than MIT (same text, no attribution
    # requirement). Allowing MIT without MIT-0 would be inconsistent.
    # Pulled in by borrow-or-share, via jsonschema -> referencing -> fluent-uri.
    "MIT-0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Two versions of the same crate = a bigger binary and a slower build.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
