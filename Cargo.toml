[package]
name = "npu"
version = "0.3.1"
edition = "2024"
description = "Generic execution engine for local AI commands"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "string"] }
jsonschema = { version = "0.56.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0.28"
sha2 = "0.11.0"
self-replace = "1.5.0"
# `system` only: the four other default features (component, disk, network,
# user) are dead weight here, and dropping the defaults also drops
# `multithread`, so `rayon` never enters the graph. Measured on
# x86_64-unknown-linux-gnu with `cargo tree --edges normal` and
# `cargo build --release` (the profile below already strips):
#   crates  107 -> 108 (+1: `sysinfo` itself; its only two
#           dependencies, `libc` and `memchr`, were already in the graph)
#   binary  8 294 984 B -> 8 399 840 B (+104 856 B, +1.3 %)
# The binary figure is the one that counts: measured with the API actually
# linked (a temporary call chain reachable from `main`), because a declared
# but uncalled dependency is dead-stripped and would have shown +384 B — a
# measurement artifact, not a cost. The crate delta is host-target only;
# `Cargo.lock` grew 174 -> 191 packages, the 16 others being the Windows and
# macOS backends that only a cross-build pays for (and that `cargo deny`,
# which has no `[graph] targets`, licence-checks all the same).
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
toml = "1.1.6"
ureq = { version = "3.4.2", default-features = false, features = ["json", "rustls"] }
indicatif = { version = "0.18.6", default-features = false }

# --- Quality: lints applied at build time ----------------------------------
# `priority = -1` on a group is mandatory as soon as an individual lint of
# that same group is overridden: without it, Cargo rejects the manifest.

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Must fix: these patterns break the CLI contract (spec §14, stdout reserved
# for the result) or hide an error.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
print_stderr = "allow"
# Must never reach a published binary.
dbg_macro = "deny"
todo = "warn"
# `pedantic` background noise with no value here.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# --- Profiles ---------------------------------------------------------------
# panic = "abort" deliberately absent: the CLI exposes distinct exit codes
# (`docs/output.md`, "Exit codes") that an abort would replace with a SIGABRT.

[profile.release]
# `thin` rather than `true`: fat LTO re-codegens the whole 174-crate graph in
# one unit at link time, which is the dominant cost of every release build.
# Measured cold, 14 cores, x86_64-unknown-linux-gnu: fat + 1 unit is
# 96 s / 6.79 MB, thin + 1 unit 66 s / 7.21 MB, thin + 16 units 37 s / 8.26 MB.
# The 1.5 MB the updater downloads on top is the accepted price of the 61 %.
lto = "thin"
codegen-units = 16
strip = true
panic = "unwind"

[profile.dev]
# Fast incremental builds, at the cost of lighter debug info.
debug = "line-tables-only"
