[package]
name = "npu"
version = "0.2.0"
edition = "2024"
description = "Generic execution engine for local AI commands"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "string"] }
jsonschema = { version = "0.56.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0.28"
sha2 = "0.11.0"
self-replace = "1.5.0"
toml = "1.1.6"
ureq = { version = "3.4.2", default-features = false, features = ["json", "rustls"] }

# --- Quality: lints applied at build time ----------------------------------
# `priority = -1` on a group is mandatory as soon as an individual lint of
# that same group is overridden: without it, Cargo rejects the manifest.

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Must fix: these patterns break the CLI contract (spec §14, stdout reserved
# for the result) or hide an error.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
print_stderr = "allow"
# Must never reach a published binary.
dbg_macro = "deny"
todo = "warn"
# `pedantic` background noise with no value here.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# --- Profiles ---------------------------------------------------------------
# panic = "abort" deliberately absent: the CLI exposes distinct exit codes
# (see IMPLEMENTATION.md §1.7) that an abort would replace with a SIGABRT.

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev]
# Fast incremental builds, at the cost of lighter debug info.
debug = "line-tables-only"
